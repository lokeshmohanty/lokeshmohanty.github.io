<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Distributed pipeline motif">
  <defs>
    <linearGradient id="dsdg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151922" />
      <stop offset="1" stop-color="#1e2534" />
    </linearGradient>
    <linearGradient id="dsdg-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f7ddb" stop-opacity="0.15" />
      <stop offset="0.5" stop-color="#6f9dff" stop-opacity="0.6" />
      <stop offset="1" stop-color="#a9c6ff" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#dsdg-bg)" />

  <!-- Seed → fan-out across parallel workers → collected candidates. -->
  <g stroke="url(#dsdg-flow)" stroke-width="2" fill="none">
    <path d="M108 200C170 200 170 96 232 96" />
    <path d="M108 200C170 200 170 165 232 165" />
    <path d="M108 200C170 200 170 235 232 235" />
    <path d="M108 200C170 200 170 304 232 304" />
    <path d="M368 96C430 96 430 200 492 200" />
    <path d="M368 165C430 165 430 200 492 200" />
    <path d="M368 235C430 235 430 200 492 200" />
    <path d="M368 304C430 304 430 200 492 200" />
  </g>

  <!-- Worker lanes: each a multi-turn exchange. -->
  <g>
    <g fill="#242c3d" stroke="#3d4a63">
      <rect x="232" y="78" width="136" height="36" rx="10" />
      <rect x="232" y="147" width="136" height="36" rx="10" />
      <rect x="232" y="217" width="136" height="36" rx="10" />
      <rect x="232" y="286" width="136" height="36" rx="10" />
    </g>
    <g fill="#6f9dff">
      <circle cx="256" cy="96" r="4" />
      <circle cx="256" cy="165" r="4" />
      <circle cx="256" cy="235" r="4" />
      <circle cx="256" cy="304" r="4" />
    </g>
    <g fill="#a9c6ff" fill-opacity="0.6">
      <rect x="272" y="91" width="52" height="4" rx="2" />
      <rect x="272" y="99" width="34" height="4" rx="2" />
      <rect x="272" y="160" width="60" height="4" rx="2" />
      <rect x="272" y="168" width="28" height="4" rx="2" />
      <rect x="272" y="230" width="44" height="4" rx="2" />
      <rect x="272" y="238" width="56" height="4" rx="2" />
      <rect x="272" y="299" width="52" height="4" rx="2" />
      <rect x="272" y="307" width="30" height="4" rx="2" />
    </g>
  </g>

  <!-- Seed store and materialized candidate store. -->
  <g fill="#242c3d" stroke="#6f9dff">
    <ellipse cx="80" cy="176" rx="30" ry="10" />
    <path d="M50 176v48a30 10 0 0 0 60 0v-48" />
    <ellipse cx="520" cy="176" rx="30" ry="10" />
    <path d="M490 176v48a30 10 0 0 0 60 0v-48" />
  </g>
  <g fill="none" stroke="#3d4a63">
    <ellipse cx="80" cy="200" rx="30" ry="10" />
    <ellipse cx="520" cy="200" rx="30" ry="10" />
  </g>
</svg>
