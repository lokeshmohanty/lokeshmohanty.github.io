<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Radar sweep motif">
  <defs>
    <linearGradient id="caesar-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151922" />
      <stop offset="1" stop-color="#1e2534" />
    </linearGradient>
    <radialGradient id="caesar-sweep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6f9dff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#6f9dff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#caesar-bg)" />

  <g transform="translate(300 210)" fill="none" stroke="#3d4a63">
    <circle r="55" />
    <circle r="105" />
    <circle r="155" />
    <circle r="205" stroke-opacity="0.5" />
    <path d="M-205 0H205M0-205V205" stroke-opacity="0.45" />
    <path d="M-145-145L145 145M145-145L-145 145" stroke-opacity="0.25" />
  </g>

  <!-- Sweep wedge, leading edge bright. -->
  <g transform="translate(300 210)">
    <path d="M0 0L178 -102A205 205 0 0 0 205 0Z" fill="url(#caesar-sweep)" />
    <path d="M0 0L205 0" stroke="#a9c6ff" stroke-width="2" />
  </g>

  <!-- Detected emitters. -->
  <g fill="#a9c6ff">
    <circle cx="392" cy="150" r="5" />
    <circle cx="228" cy="118" r="3.5" fill-opacity="0.7" />
    <circle cx="200" cy="284" r="4" fill-opacity="0.55" />
    <circle cx="404" cy="268" r="3" fill-opacity="0.4" />
  </g>
  <g fill="none" stroke="#a9c6ff" stroke-opacity="0.45">
    <circle cx="392" cy="150" r="13" />
    <circle cx="392" cy="150" r="22" stroke-opacity="0.2" />
  </g>

  <!-- Pulse train along the base. -->
  <path d="M40 358h26v-26h13v26h34v-16h13v16h30v-30h13v30h28v-20h13v20h26"
        fill="none" stroke="#4f7ddb" stroke-width="2" stroke-linejoin="round" />
</svg>
